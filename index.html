<!DOCTYPE html>
<html lang="es">
<head>
<style id="candado">html{visibility:hidden}</style>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
  // Configuración de tu proyecto Firebase VELASCALP
  const firebaseConfig = {
    apiKey: "AIzaSyDcgTk4stGC-K6npLnMECGjFb6S2pAQbK",
    authDomain: "velascalp.firebaseapp.com",
    projectId: "velascalp",
    storageBucket: "velascalp.appspot.com"
  };

  // Inicializar Firebase
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }

  // Verificar la sesión del usuario
  firebase.auth().onAuthStateChanged((user) => {
    if (!user) {
      window.location.replace("acceso.html");
    } else {
      const candado = document.getElementById("candado");
      if (candado) candado.remove();
    }
  });

  // Botón de salir para Firebase
  function botonSalir() {
    var b = document.createElement("button");
    b.textContent = "Cerrar sesión";
    b.style.cssText =
      "position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));" +
      "z-index:99999;padding:9px 14px;border:0;border-radius:20px;" +
      "background:#111;color:#fff;font:500 13px system-ui,sans-serif;opacity:.85;";
    b.onclick = async function () {
      await firebase.auth().signOut();
      window.location.replace("acceso.html");
    };
    document.body.appendChild(b);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", botonSalir);
  } else {
    botonSalir();
  }
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELASCALP — Sistema de Evaluación de Salud Capilar</title>
<style>
:root{
  --bg:#f7f7f6;--card:#fff;--text:#111;--muted:#6d6d6d;--line:#e3e3e3;
  --black:#000;--soft:#f1f1f1;--ok:#fff;--danger:#000;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,Helvetica,sans-serif}
.wrap{max-width:1280px;margin:auto;padding:0 28px 36px}
.topbar{height:132px;margin:0 -28px 28px;padding:0 34px;background:#fff;color:#111;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-between}
.brandbar{display:flex;align-items:center;gap:13px}
.logo-mark{width:54px;height:54px;flex:0 0 54px}
.logo-mark svg{width:100%;height:100%;display:block}
.brand{font-size:28px;font-weight:500;letter-spacing:5px;line-height:1}
.sub{color:#111;margin:8px 0 0;font-size:12px;letter-spacing:2.4px;text-transform:uppercase;opacity:.9}
.top-actions{display:flex;gap:28px;align-items:center;font-size:13px}
.top-action{display:flex;align-items:center;gap:8px}.top-action svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7}
.layout{display:grid;grid-template-columns:220px 1fr;gap:34px}
.sidebar{border-right:1px solid var(--line);padding-right:22px;min-height:680px}
.navitem{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:11px;margin-bottom:8px;font-size:15px;cursor:pointer}
.navitem.active{background:#000;color:#fff}
.navitem svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6}
.sidebar-logo{position:sticky;top:20px;margin-top:250px;text-align:center}
.sidebar-logo .miniword{font-size:19px;letter-spacing:3px}.sidebar-logo .minisub{font-size:7px;letter-spacing:1.7px;margin-top:5px}
.main{min-width:0}
.steps{background:#fff;border:1px solid var(--line);border-radius:15px;padding:22px 30px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.step{display:flex;align-items:center;gap:10px;color:#777;font-size:15px;white-space:nowrap}.step:not(:last-child):after{content:"";display:block;width:55px;height:1px;background:#ddd;margin-left:18px}
.step .num{width:36px;height:36px;border:1px solid #ccc;border-radius:50%;display:grid;place-items:center}
.step.active{color:#111;font-weight:700}.step.active .num{background:#000;color:#fff;border-color:#000}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:48px 42px;box-shadow:0 5px 20px #00000006;margin-bottom:20px}
.question-icon{width:58px;height:58px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-size:31px;font-weight:700;margin:0 auto 24px}
.question{text-align:center;font-size:29px;font-weight:650;margin-bottom:12px}
.hint{text-align:center;color:#777;font-size:15px;margin-bottom:34px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:760px;margin:auto}
.options button{border:1px solid #bbb;background:#fff;padding:22px;border-radius:13px;font-size:20px;cursor:pointer;transition:.15s}
.options button:hover{border-color:#000}.options button.selected{background:#000;color:#fff;border-color:#000}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:30px}
.btn{border:1px solid #bbb;background:#fff;padding:14px 22px;border-radius:11px;font-size:15px;cursor:pointer}
.btn.primary{background:#000;color:#fff;border-color:#000}.btn:disabled{opacity:.35;cursor:not-allowed}
.progresswrap{text-align:center;color:#555;font-size:14px}.progress{width:450px;max-width:45vw;height:7px;background:#e6e6e6;border-radius:8px;overflow:hidden;margin-top:8px}.bar{height:100%;width:0;background:#000;transition:.25s}
.footer{text-align:center;color:#777;font-size:12px;line-height:1.6;margin-top:26px}
.hidden{display:none}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#eee;margin:3px;font-size:13px}
.high{font-weight:700}.medium{font-weight:700}.low{font-weight:700}
.result{border-left:4px solid #000;padding-left:15px;margin:18px 0}.meter{height:8px;background:#eee;border-radius:10px;overflow:hidden}.meter span{display:block;height:100%;background:#000}
.warning,.danger{background:#f4f4f4;border:1px solid #bbb;padding:15px;border-radius:12px;margin:15px 0}
.small{font-size:13px;color:var(--muted);line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select{padding:12px;border:1px solid #bbb;border-radius:10px;font-size:15px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{display:none}.top-actions{display:none}.steps{overflow:auto;justify-content:flex-start;gap:18px}.step:not(:last-child):after{width:25px}.progress{max-width:40vw}}
@media(max-width:650px){.wrap{padding:0 14px 25px}.topbar{margin:0 -14px 18px;padding:0 18px;height:78px}.brand{font-size:22px;letter-spacing:3px}.sub{font-size:9px;letter-spacing:1.5px}.card{padding:30px 18px}.question{font-size:22px}.options{grid-template-columns:1fr}.progress{width:180px}.grid2{grid-template-columns:1fr}}
@media print{body{background:#fff}.no-print,.topbar,.sidebar,.steps,.footer{display:none!important}.card{box-shadow:none;border:0}}

.brand-logo-exact{
  height:108px;
  width:auto;
  max-width:60vw;
  display:block;
  object-fit:contain;
  object-position:left center;
}
@media(max-width:650px){
  .brand-logo-exact{height:62px;max-width:70vw}
}

.top-action,.navitem{cursor:pointer}
.mobnav{display:none;gap:8px;overflow-x:auto;margin-bottom:16px}
.mobnav .navitem{flex:0 0 auto;margin:0;padding:10px 14px;white-space:nowrap;font-size:14px}
@media(max-width:900px){.mobnav{display:flex}}
@media print{.mobnav{display:none!important}}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap}
details{border-bottom:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:600}details p,details li{color:#333;line-height:1.55;font-size:14px}
.field input.wide{width:100%}
.fgrid{grid-template-columns:1fr 1fr;display:grid;gap:10px 14px;margin:10px 0}.full{grid-column:1/-1}.field textarea{padding:12px;border:1px solid #bbb;border-radius:10px;font:inherit;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{padding:8px 14px;border:1px solid #bbb;border-radius:20px;cursor:pointer;font-size:14px}.chip.on{background:#000;color:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:14px;line-height:1.4}.chk input{margin-top:3px}
@media(max-width:650px){.fgrid{grid-template-columns:1fr}}
</style>
</head>
<body>

</body>
</html>
